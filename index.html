<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Taravinyas Tamil Input Engine</title>
	<link rel="stylesheet" type="text/css" href="css/pico.classless.zinc.min.css">
	<link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>
	<header>
		<h1>Taravinyas Tamil Input Engine</h1>
	</header>
	<main>
		<form>
			<fieldset id="mode-selection">
				<legend>Vowel or Consonant</legend>
				<button type="button" data-vowel-or-consonant-mode="vowel-mode" onclick="setMode(this.dataset.vowelOrConsonantMode)">Vowel</button>
				<button type="button" data-vowel-or-consonant-mode="consonant-mode" onclick="setMode(this.dataset.vowelOrConsonantMode)">Consonant</button>
			</fieldset>

			<section id="vowel-section">
				<h2>Vowel</h2>
				<fieldset class="extended-fieldset">
					<legend>Extended letters:</legend>
					<label>
						<input type="radio" name="extended-letters">
						Pulli/<span lang="ta" class="tamil-text">்</span>
					</label>
					<label>
						<input type="radio" name="extended-letters">
						Aytam/<span lang="ta" class="tamil-text">ஃ</span>
					</label>
				</fieldset>
				<fieldset class="coarse-fieldset" onchange="appearFine(event, this)">
					<legend>Coarse position:</legend>
					<label>
						<input type="radio" name="vowel-coarse-position" value="0">
						a/<span lang="ta" class="tamil-text">அ</span>
					</label>
					<label>
						<input type="radio" name="vowel-coarse-position" value="1">
						i/<span lang="ta" class="tamil-text">இ</span>
					</label>
					<label>
						<input type="radio" name="vowel-coarse-position" value="2">
						u/<span lang="ta" class="tamil-text">உ</span>
					</label>
					<label>
						<input type="radio" name="vowel-coarse-position" value="4">
						E/<span lang="ta" class="tamil-text">எ</span>
					</label>
					<label>
						<input type="radio" name="vowel-coarse-position" value="5">
						O/<span lang="ta" class="tamil-text">ஒ</span>
					</label>
				</fieldset>
				<fieldset class="fine-fieldset" onchange="processFine(event)" hidden>
					<legend>Fine position:</legend>
					<label>
						<input type="radio" name="vowel-fine-position" value="0">
						Normal Monophthong
					</label>
					<label>
						<input type="radio" name="vowel-fine-position" value="1">
						Contrastive Monophthong
					</label>
					<label>
						<input type="radio" name="vowel-fine-position" value="2">
						Diphthong
					</label>
				</fieldset>
			</section>

			<section id="consonant-section" hidden>
				<h2>Consonant</h2>
				<fieldset class="extended-fieldset">
					<legend>Extended letters:</legend>
					<label>
						<input type="radio" name="extended-letters">
						ja/<span lang="ta" class="tamil-text">ஜ</span>
					</label>
					<label>
						<input type="radio" name="extended-letters">
						ha/<span lang="ta" class="tamil-text">ஹ</span>
					</label>
				</fieldset>
				<fieldset class="coarse-fieldset" onchange="appearFine(event, this)">
					<legend>Coarse position:</legend>
					<label>
						<input type="radio" name="consonant-coarse-position" value="0">
						ka/<span lang="ta" class="tamil-text">க</span> (Velar)
					</label>
					<label>
						<input type="radio" name="consonant-coarse-position" value="1">
						ca/<span lang="ta" class="tamil-text">ச</span> (Palatal)
					</label>
					<label>
						<input type="radio" name="consonant-coarse-position" value="2">
						Ta/<span lang="ta" class="tamil-text">ட</span> (Retroflex)
					</label>
					<label>
						<input type="radio" name="consonant-coarse-position" value="3">
						ta/<span lang="ta" class="tamil-text">த</span> (Dental)
					</label>
					<label>
						<input type="radio" name="consonant-coarse-position" value="4">
						pa/<span lang="ta" class="tamil-text">ப</span> (Labial)
					</label>
					<label>
						<input type="radio" name="consonant-coarse-position" value="5">
						r2a/<span lang="ta" class="tamil-text">ற</span> (Alveolar)
					</label>
				</fieldset>
				<fieldset class="fine-fieldset" onchange="processFine(event, this)" hidden>
					<legend>Fine position:</legend>
					<label>
						<input type="radio" name="consonant-fine-position">
						Vallinam
					</label>
					<label>
						<input type="radio" name="consonant-fine-position">
						Mellinam
					</label>
					<label>
						<input type="radio" name="consonant-fine-position" id="consonant-fine-idaiyinam">
						Idaiyinam
						<div id="idaiyinam-nested-options" hidden>
							<label>
								<input type="radio" name="fine-idaiyinam-position" value="false">
								Approximant (ra, ர / Zha, ழ)
							</label>
							<label>
								<input type="radio" name="fine-idaiyinam-position" value="true">
								Lateral (la, ல / La, ள)
							</label>
						</div>
					</label>

					<label>
						<input type="radio" name="consonant-fine-position">
						Sibilant [Grantha]
					</label>
				</fieldset>
			</section>	
		</form>
		<textarea 
		name="result" 
		lang="ta" 
		class="tamil-text"
		rows=6
		placeholder="What you select is written here..." 
		aria-label="Text Buffer Result"></textarea>
	</main>
	<footer></footer>
	<script src="scripts.js"></script>
	<script type="module" src="js/vowel.js"></script>
	<script type="module" src="js/consonant.js"></script>
</body>
</html>
