<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Taravinyas Tamil Input Engine</title>
	<link rel="stylesheet" type="text/css" href="css/pico.classless.zinc.min.css">
	<link rel="stylesheet" type="text/css" href="css/styles.css">
</head>
<body>
	<header>
		<h1>Taravinyas Tamil Input Engine</h1>
	</header>
	<main>
		<nav aria-label="Modes">
		  <button type="button" data-vowel-or-consonant-mode="vowel-mode" onclick="setMode(this.dataset.vowelOrConsonantMode)">Vowel</button>
		  <button type="button" data-vowel-or-consonant-mode="consonant-mode" onclick="setMode(this.dataset.vowelOrConsonantMode)">Consonant</button>
		</nav>
		
		<section id="vowel-section">
			<h2>Vowel</h2>
		</section>
		
		<section id="consonant-section" hidden>
		 <h2>Consonant</h2> 
		</section>	
	</main>
	<footer></footer>
	<script src="scripts.js"></script>
</body>
</html>
